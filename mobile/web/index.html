<!DOCTYPE html>
<html lang="id">
<head>

    Diganti oleh nilai argumen `--base-href` saat `flutter build web`.
    Harus diawali dan diakhiri "/".
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="OtoGo - booking bengkel, doorsmeer, dan sparepart di Kota Medan dalam satu aplikasi.">
  <meta name="theme-color" content="#111418">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="OtoGo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <title>OtoGo</title>
  <link rel="manifest" href="manifest.json">

  <style>

    html, body { margin: 0; height: 100%; background: #111418; }

  <script src="flutter_bootstrap.js" async></script>
