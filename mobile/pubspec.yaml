name: otogo_mobile
description: "OtoGo - aplikasi pelanggan untuk booking bengkel, doorsmeer, dan sparepart di Kota Medan."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  flutter_secure_storage: ^11.0.0
  google_fonts: ^8.2.1
  intl: 0.20.2
  flutter_animate: ^4.5.2
  google_nav_bar: ^5.0.7
  loading_animation_widget: ^1.3.0
  skeletonizer: ^2.1.3
  device_info_plus: ^13.2.0
  flutter_widget_from_html_core: ^0.17.4
  url_launcher: ^6.3.3
  flutter_markdown_plus: ^1.0.12
  flutter_svg: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# ---------------------------------------------------------------------------
# Ikon peluncur aplikasi (sumber: resources/brand di proyek Laravel)
# ---------------------------------------------------------------------------
# Setelah mengganti berkas di assets/logo/, jalankan ulang:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/logo/app_icon.png"

  android: "ic_launcher"
  # Ikon adaptif Android: tanda oranye di atas latar tinta OtoGo.
  adaptive_icon_background: "#111418"
  adaptive_icon_foreground: "assets/logo/app_icon_foreground.png"

  ios: true
  remove_alpha_ios: true

  # Ikon web disalin langsung dari brand kit (web/icons), tidak dibuat di sini.
