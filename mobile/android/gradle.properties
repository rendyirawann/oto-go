org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# ---------------------------------------------------------------------------
# Kompilasi inkremental Kotlin dimatikan.
#
# Di Windows, build gagal dengan "Could not close incremental caches ...
# class-fq-name-to-source.tab" saat mengompilasi plugin (local_auth_android,
# device_info_plus, dst) karena berkas .tab pada cache inkremental tidak bisa
# ditutup. Mematikan incremental melewati cache tersebut sepenuhnya.
#
# Efeknya build ulang sedikit lebih lama, tetapi tidak lagi gagal acak.
# Kalau nanti dicoba di mesin lain dan aman, baris ini boleh dihapus.
# ---------------------------------------------------------------------------
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
